name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kerstlampjes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('Kerstlampjes/**/*.gradle*', 'Kerstlampjes/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Lint
        run: ./gradlew lintDebug --no-daemon
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            Kerstlampjes/app/build/outputs/apk/debug/*.apk
            Kerstlampjes/app/build/outputs/apk/release/*.apk
